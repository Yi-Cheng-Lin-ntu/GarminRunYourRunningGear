<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Garmin Run 跑者風格與補水方式互動測驗" />
    <title>Garmin Run | 跑者風格測驗</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="#start" aria-label="Garmin Run home">GARMIN <span>RUN</span></a>
      <button class="language-toggle" type="button" data-action="toggle-language" aria-label="Switch language">
        <span data-language-label>EN</span>
      </button>
    </header>

    <main class="app-shell">
      <section class="screen screen-start is-active" id="start" aria-labelledby="start-title">
        <div class="eyebrow" data-i18n="start.eyebrow">GARMIN RUN 2026</div>
        <div class="start-visual" aria-hidden="true">
          <div class="visual-ring visual-ring-back"></div>
          <div class="visual-ring visual-ring-front"></div>
          <span class="visual-mark">RUN</span>
          <span class="visual-kicker">YOUR<br />PACE</span>
        </div>
        <p class="section-label" data-i18n="start.label">跑者風格測驗</p>
        <h1 id="start-title" data-i18n="start.title">找到你的跑者節奏</h1>
        <p class="lead" data-i18n="start.description">五個跑步情境，測出最像你的跑者風格，看看哪種補水方式適合你。</p>
        <button class="button button-primary button-wide" type="button" data-action="start" data-i18n="start.button" disabled>開始測驗</button>
        <p class="microcopy" data-i18n="start.note">約 1 分鐘完成・無需登入</p>
      </section>

      <section class="screen screen-quiz" id="quiz" aria-labelledby="question-title" hidden>
        <div class="quiz-topline">
          <button class="text-button" type="button" data-action="back" data-i18n="navigation.back">返回</button>
          <span class="question-count"><span data-question-count>01 / 05</span></span>
        </div>
        <div class="progress-track" aria-label="Question progress" data-progress-track>
          <span></span><span></span><span></span><span></span><span></span>
        </div>
        <div class="question-intro">
          <div class="question-number-wrap">
            <span class="question-number" data-question-number>01</span><span class="question-total">/ 05</span>
          </div>
          <h2 id="question-title" data-question-prompt></h2>
        </div>
        <form class="options-list" data-options-list></form>
        <div class="quiz-actions">
          <button class="button button-primary button-wide" type="button" data-action="next" data-i18n="navigation.next" disabled>下一題</button>
        </div>
      </section>

      <section class="screen screen-result" id="result" aria-labelledby="result-title" hidden>
        <div class="result-header">
          <p class="eyebrow" data-i18n="result.eyebrow">YOUR RUNNER STYLE</p>
          <div class="result-visual" data-result-visual aria-hidden="true"></div>
          <p class="section-label" data-i18n="result.label">跑者身分</p>
          <h2 id="result-title" data-result-title></h2>
          <p class="result-description" data-result-description></p>
        </div>

        <div class="result-detail-block">
          <p data-result-detail></p>
        </div>

        <div class="result-content">
          <section class="result-section recommendation-section" data-recommendation-section>
            <p class="section-label" data-i18n="result.hydrationLabel">下一次可以試試</p>
            <p class="recommendation-kicker" data-result-hydration-title></p>
            <h3 class="recommendation-slogan" data-result-cta></h3>
            <p class="recommendation-description" data-result-hydration-description></p>
          </section>

          <section class="gear-panel" data-gear-panel>
            <p class="section-label" data-i18n="result.note">補水裝備推薦</p>
            <p class="gear-value" data-result-gear></p>
          </section>

          <button class="button button-secondary button-wide" type="button" data-action="retry" data-i18n="result.retry">重新測驗</button>
        </div>
      </section>
    </main>

    <footer class="site-footer">GARMIN RUN <span>MOVE WITH PURPOSE</span></footer>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
